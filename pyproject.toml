[project]
name = "nl2sql-agent"
version = "0.1.0"
description = "Text-to-SQL data analysis agent with self-correction loop and evaluation harness"
requires-python = ">=3.11,<3.12"
dependencies = [
    "openai>=1.40.0",
    "python-dotenv>=1.0.1",
    "langgraph>=0.2.50",
    "streamlit>=1.38.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "pre-commit>=3.8.0",
]
observability = [
    "langfuse>=3.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that generate large data or hit network",
]
